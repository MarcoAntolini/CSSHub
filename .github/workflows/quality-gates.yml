name: Quality Gates

on:
  pull_request:
    branches: ["*"]
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension (production)
        env:
          VITE_OAUTH_BACKEND_BASE_URL: https://csshub-oauth.example.com
        run: npm run build:extension:prod

      - name: Bundle size budgets
        run: npm run check:bundle-budgets

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Backend Vercel boundary (shared sync + import guard)
        run: |
          npm run build --workspace @csshub/shared
          npm run vercel:prepare --workspace @csshub/backend
          npm run check:backend-vercel

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        env:
          CI: ""
        run: xvfb-run -a npm run test:e2e

      - name: Security checks (JSON report)
        run: npm run test:security:json -- --output security-report.json

      - name: Upload security report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json
          if-no-files-found: warn
